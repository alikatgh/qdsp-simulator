[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dspsim"
version = "0.2.1"
description = "Clean-room educational DSP simulator with predication, packets, MMIO, assembler/disassembler, and optional ELF loader."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
requires-python = ">=3.9"
dependencies = [
  "click>=8",
]

keywords = ["dsp", "simulator", "assembler", "hexagon-inspired", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Assemblers",
  "Topic :: System :: Emulators",
]

[project.optional-dependencies]
elf = ["pyelftools>=0.31"]
pretty = ["rich>=13"]

[project.scripts]
dspsim = "dspsim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.8",
  "pyelftools>=0.31",
  "rich>=13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
mypy_path = "scripts"
ignore_missing_imports = true
# The type-checked surface. Grow this list as more modules gain annotations.
files = [
  "scripts",
  "src/dspsim/bus.py",
  "tests/test_differential.py",
  "tests/test_bus_faults.py",
]
